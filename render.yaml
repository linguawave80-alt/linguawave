services:
  # ─── Backend: Express API + Socket.IO ────────────────────────────────────────
  - type: web
    name: linguawave-backend
    runtime: node
    plan: free                      # change to starter to avoid 15-min sleep / cold starts
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false                 # service-account JSON (plain or base64)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false                 # must be a sender verified in Brevo
      # !! Must be the REAL public URL of the frontend service (check the Render dashboard —
      # !! Render appends a suffix like -ab12 if the name was taken). No trailing slash / path.
      - key: FRONTEND_URL
        value: https://linguawave-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://linguawave-frontend.onrender.com
      # Meet (video rooms). TURN is optional; without it only STUN is offered.
      - key: MEET_MAX_PEERS
        value: "3"
      - key: MEET_TURN_URLS
        sync: false
      - key: MEET_TURN_USERNAME
        sync: false
      - key: MEET_TURN_CREDENTIAL
        sync: false

  # ─── Frontend: Next.js ───────────────────────────────────────────────────────
  - type: web
    name: linguawave-frontend
    runtime: node
    plan: free
    rootDir: frontend
    # --include=dev: `next build` needs typescript + @types/*, which are devDependencies
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_OPTIONS            # keeps `next build` under the free plan's 512 MB
        value: --max-old-space-size=460
      # !! Must be the REAL public URL of the backend service. These are baked in at BUILD time,
      # !! so after changing them you must redeploy the frontend.
      - key: NEXT_PUBLIC_API_URL
        value: https://linguawave-backend-qk64.onrender.com/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://linguawave-backend-qk64.onrender.com
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
